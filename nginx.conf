events {}

http {

    server {
        listen 80;
        server_name croqueurs-de-pommes-de-touraine.fr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name croqueurs-de-pommes-de-touraine.fr;

        ssl_certificate /etc/letsencrypt/live/croqueurs-de-pommes-de-touraine.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/croqueurs-de-pommes-de-touraine.fr/privkey.pem;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend:8080/;
        }
    }
}