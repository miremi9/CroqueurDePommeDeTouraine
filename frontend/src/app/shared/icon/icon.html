<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  [attr.fill]="filled ? 'currentColor' : 'none'"
  stroke="currentColor"
  stroke-width="2">

  <ng-container [ngSwitch]="name">

    <!-- Étoile -->
    <path *ngSwitchCase="'star'"
      d="M12 17.27l4.15 2.51c.76.46 1.69-.22 1.49-1.08
         l-1.1-4.72 3.67-3.18c.67-.58.31-1.68-.57-1.75
         l-4.83-.41-1.89-4.46c-.34-.81-1.5-.81-1.84 0
         L9.91 8.62l-4.83.41c-.88.07-1.24 1.17-.57 1.75
         l3.67 3.18-1.1 4.72c-.2.86.75 1.54 1.49 1.08
         l4.15-2.5z" />

    <!-- Modifier -->
    <ng-container *ngSwitchCase="'edit'">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </ng-container>

    <!-- Supprimer -->
    <ng-container *ngSwitchCase="'delete'">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </ng-container>

    <!-- Télécharger -->
    <ng-container *ngSwitchCase="'download'">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </ng-container>

  </ng-container>

</svg>
