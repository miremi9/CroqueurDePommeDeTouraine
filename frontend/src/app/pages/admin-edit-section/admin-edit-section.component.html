<div class="admin-page">
  <h1>Gestion des sections</h1>

  <div *ngIf="loading">Chargement...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div style="margin: 0 0 1rem 0;">
    <input
      type="text"
      placeholder="Filtrer par ID, nom, path ou rôle..."
      [value]="filterText"
      (input)="onFilterChange($any($event.target).value)"
      style="padding: 0.4rem 0.6rem; width: 320px;"
    />
  </div>

  <table class="roles-table" *ngIf="!loading">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Path</th>
        <th>Parent</th>
        <th>Type</th>
        <th *ngFor="let role of roleKeys; trackBy: trackByRole">{{ role }}</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let section of displayedSections; trackBy: trackBySectionId">
        <!-- Ligne Lecture -->
        <tr>
          <td>
            <input
              type="text"
              [(ngModel)]="section.nom"
              style="padding: 0.3rem 0.4rem; width: 100%; box-sizing: border-box;"
            />
          </td>
          <td>
            <input
              type="text"
              [(ngModel)]="section.path"
              style="padding: 0.3rem 0.4rem; width: 100%; box-sizing: border-box;"
            />
          </td>
          <td>
            <select
              [(ngModel)]="section.idParent"
              [disabled]="parentSectionIds.has(section.idSection)"
              style="padding: 0.3rem 0.4rem; width: 100%; box-sizing: border-box;"
            >
              <option [ngValue]="null">Aucun parent</option>
              <option *ngFor="let parent of (parentOptionsBySectionId.get(section.idSection) || [])" [ngValue]="parent.idSection">
                {{ parent.nom }}
              </option>
            </select>
          </td>
          <td>Lecture</td>
          <td *ngFor="let role of roleKeys; trackBy: trackByRole" class="center">
            <input
              type="checkbox"
              [checked]="hasCanRead(role, section)"
              (change)="toggleCanRead(role, $any($event.target).checked, section)"
            />
          </td>
          <td><!-- pas d'action spécifique sur la ligne Lecture --></td>
        </tr>

        <!-- Ligne Écriture -->
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td>Écriture</td>
          <td *ngFor="let role of roleKeys; trackBy: trackByRole" class="center">
            <input
              type="checkbox"
              [checked]="hasCanWrite(role, section)"
              [disabled]="isWriteRoleLocked(role)"
              [class.disabled-checkbox]="isWriteRoleLocked(role)"
              (change)="toggleCanWrite(role, $any($event.target).checked, section)"
            />
          </td>
          <td>
            <button
              (click)="save(section)"
              [disabled]="savingIds.has(section.idSection)"
            >
              {{ savingIds.has(section.idSection) ? 'Saving...' : 'Save' }}
            </button>
          </td>
        </tr>
      </ng-container>

      <!-- RANGÉES pour créer une nouvelle section -->
      <!-- Lecture -->
      <tr style="background-color: #f9fafb;">
        <td>
          <input
            type="text"
            placeholder="Nom de la section"
            [(ngModel)]="newSectionNom"
            style="padding: 0.3rem 0.4rem; width: 100%; box-sizing: border-box;"
          />
        </td>
        <td>
          <input
            type="text"
            placeholder="Path de la section"
            [(ngModel)]="newSectionPath"
            style="padding: 0.3rem 0.4rem; width: 100%; box-sizing: border-box;"
          />
        </td>
        <td>
          <select
            [(ngModel)]="newSectionParentId"
            style="padding: 0.3rem 0.4rem; width: 100%; box-sizing: border-box;"
          >
            <option [ngValue]="null">Aucun parent</option>
            <option *ngFor="let parent of parentOptionsForCreate" [ngValue]="parent.idSection">
              {{ parent.nom }}
            </option>
          </select>
        </td>
        <td>Lecture</td>
        <td *ngFor="let role of roleKeys; trackBy: trackByRole" class="center">
          <input
            type="checkbox"
            [checked]="hasCanRead(role)"
            (change)="toggleCanRead(role, $any($event.target).checked)"
          />
        </td>
        <td rowspan="2" style="vertical-align: middle; text-align: center;">
          <button
            (click)="createSection()"
            [disabled]="creating || !newSectionNom.trim() || !newSectionPath.trim()"
          >
            {{ creating ? 'Création...' : 'Créer' }}
          </button>
        </td>
      </tr>
      <!-- Écriture -->
      <tr style="background-color: #f9fafb;">
        <td></td>
        <td></td>
        <td></td>
        <td>Écriture</td>
        <td *ngFor="let role of roleKeys; trackBy: trackByRole" class="center">
          <input
            type="checkbox"
            [checked]="hasCanWrite(role)"
            [disabled]="isWriteRoleLocked(role)"
            [class.disabled-checkbox]="isWriteRoleLocked(role)"
            (change)="toggleCanWrite(role, $any($event.target).checked)"
          />
        </td>
      </tr>
    </tbody>
  </table>
</div>

@if (showResultModal) {
  <div class="modal__backdrop result-modal-backdrop" (click)="closeResultModal()"></div>
  <div
    class="modal__window result-modal"
    [class.result-modal--error]="resultModalIsError"
    [class.result-modal--success]="!resultModalIsError"
    role="alertdialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <h3 class="modal__title result-modal__title">{{ resultModalTitle }}</h3>
    <p class="result-modal__message">{{ resultModalMessage }}</p>
    <div class="modal__actions">
      <button type="button" class="modal__btn modal__btn--primary" (click)="closeResultModal()">Fermer</button>
    </div>
  </div>
}
