<section class="reset-password-page">
  <h1>Reinitialiser le mot de passe</h1>

  <p class="hint">
    Saisissez votre nouveau mot de passe.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="reset-form">
    <label for="newPassword">Nouveau mot de passe</label>
    <input
      id="newPassword"
      type="password"
      formControlName="newPassword"
      placeholder="Minimum 8 caracteres"
    />
    <small *ngIf="form.controls.newPassword.touched && form.controls.newPassword.invalid">
      Le mot de passe doit contenir au moins 8 caracteres.
    </small>

    <label for="confirmPassword">Confirmer le mot de passe</label>
    <input
      id="confirmPassword"
      type="password"
      formControlName="confirmPassword"
      placeholder="Retapez le mot de passe"
    />

    <p *ngIf="errorMessage" class="message message--error">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="message message--success">{{ successMessage }}</p>

    <div class="actions">
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Envoi...' : 'Reinitialiser' }}
      </button>
      <a routerLink="/accueil">Retour accueil</a>
    </div>
  </form>
</section>
